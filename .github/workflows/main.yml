name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'resources/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then cp manifest.json www/manifest.json; fi
          if [ -f sw.js ]; then cp sw.js www/sw.js; fi
          if [ -d icons ]; then cp -r icons www/icons; fi

      - name: Install Capacitor 6
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @aparajita/capacitor-biometric-auth@7
          npm install @capacitor/assets@3 --save-d
      
      - name: Initialize Capacitor (non-interactive)
        run: |
          npx cap init "Money Manager Pro" com.ullasankv.moneymanagerpro --web-dir www
          npx cap add android
          npx cap sync android
      - name: Add biometric permission
        run: |
           MANIFEST="android/app/src/main/AndroidManifest.xml"
           if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            # Insert <uses-permission> as a direct child of <manifest>, right after <manifest ...>
              sed -i '0,/<manifest /s//<manifest /' "$MANIFEST"
              sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application|' "$MANIFEST"
            fi
          
      - name: Add biometric permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            sed -i 's|</application>|    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</application>|' "$MANIFEST"
          fi

      - name: Generate app icons
        run: |
          if [ -f resources/icon.png ]; then
            echo "✅ Found resources/icon.png — generating icons..."
            npx @capacitor/assets generate --android --iconBackgroundColor '#1565c0' --iconBackgroundColorDark '#0d47a1'
          else
            echo "⚠️ WARNING: resources/icon.png not found — APK will use default Capacitor icon"
          fi

      - name: Add FileProvider paths for file sharing
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-path name="external" path="." />
          </paths>
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManagerPro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload APK (raw, for direct download)
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManagerPro-apk-unsigned
          path: android/app/build/outputs/apk/debug/
