name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'resources/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          A: ${{ secrets.KEYSTORE_BASE64 }}
          B: ${{ secrets.KEYSTORE_PASSWORD }}
          C: ${{ secrets.KEY_ALIAS }}
          D: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in A B C D; do
            if [ -z "${!v}" ]; then echo "Missing secret. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions."; exit 1; fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then cp manifest.json www/manifest.json; fi
          if [ -f sw.js ]; then cp sw.js www/sw.js; fi
          if [ -d icons ]; then cp -r icons www/icons; fi

      # Capacitor 8 targets Android 16 (API 36), which Google Play requires for new apps and updates.
      # @capgo/native-purchases = Google Play Billing (one-time Premium purchase).
      - name: Install Capacitor 8
        run: |
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/filesystem@8 @capacitor/share@8 @capacitor/local-notifications@8 @capgo/capacitor-native-biometric@^8 @capacitor-community/speech-recognition@^7.0.0 @capgo/native-purchases@^8.2.0
          npm install @capacitor/assets@3 --save-dev
      
      - name: Initialize Capacitor (non-interactive)
        run: |
          npx cap init "Money Manager Pro" com.ullasankv.moneymanagerpro --web-dir www
          npx cap add android
      
      - name: Add mic, notification and billing permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          add_perm() { if ! grep -q "$1" "$MANIFEST"; then sed -i "s|<application|<uses-permission android:name=\"$1\" />\n    <application|" "$MANIFEST"; fi; }
          add_perm android.permission.RECORD_AUDIO
          add_perm android.permission.POST_NOTIFICATIONS
          add_perm com.android.vending.BILLING
          if ! grep -q "android.speech.RecognitionService" "$MANIFEST"; then
            sed -i 's#<application#<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' "$MANIFEST"
          fi
          npx cap sync android
          grep -n "uses-permission" "$MANIFEST"

      - name: Add biometric permission
        run: |
           MANIFEST="android/app/src/main/AndroidManifest.xml"
           if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            # Insert <uses-permission> as a direct child of <manifest>, right after <manifest ...>
              sed -i '0,/<manifest /s//<manifest /' "$MANIFEST"
              sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application|' "$MANIFEST"
            fi

      - name: Generate app icons
        run: |
          if [ -f resources/icon.png ]; then
            echo "✅ Found resources/icon.png — generating icons..."
            npx @capacitor/assets generate --android --iconBackgroundColor '#1565c0' --iconBackgroundColorDark '#0d47a1'
          else
            echo "⚠️ WARNING: resources/icon.png not found — APK will use default Capacitor icon"
          fi

      - name: Add FileProvider paths for file sharing
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-path name="external" path="." />
          </paths>
          EOF

      # Android only installs an update when the new APK has the SAME signing key and a HIGHER versionCode.
      # The debug key changes on every CI run, so we sign with our own keystore and bump the version each run.
      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Check Play requirements (target API)
        run: |
          grep -n "targetSdkVersion\|compileSdkVersion" android/variables.gradle
          T=$(grep -o "targetSdkVersion = [0-9]*" android/variables.gradle | grep -o "[0-9]*$")
          if [ -z "$T" ] || [ "$T" -lt 36 ]; then echo "ERROR: targetSdkVersion is $T. Google Play requires 36 or higher for new apps and updates."; exit 1; fi

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/MoneyManagerPro.jks"

      - name: Align and sign APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/MoneyManagerPro.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out MoneyManagerPro.apk aligned.apk
          "$BT/apksigner" verify --print-certs MoneyManagerPro.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/MoneyManagerPro.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManagerPro-apk
          path: MoneyManagerPro.apk
          if-no-files-found: error
