name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/main.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6

      - name: Create Android project
        run: |
          npx cap init "Money Manager Pro" com.ullasankv.moneymanagerpro --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyManagerPro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
